# Définition commune des services. Surcharges : compose.dev.yml, compose.test.yml.
services:
  back:
    build:
      context: .
      target: back
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
  front:
    build:
      context: .
      target: front
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - back

# Définition commune des services. Surcharges : compose.dev.yml, compose.test.yml.
services:
  back:
    build:
      context: .
      target: back
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    labels:
      co.elastic.logs/json.keys_under_root: "true"
      co.elastic.logs/json.add_error_key: "true"
  front:
    build:
      context: .
      target: front
    ports:
      - "80:80"
      - "443:443"
    labels:
      co.elastic.logs/json.keys_under_root: "true"
      co.elastic.logs/json.add_error_key: "true"
    depends_on:
      - back

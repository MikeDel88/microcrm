# Exécution des images publiées dans GHCR (aucun build local).
# Usage (bash/zsh) : TAG=<sha> docker compose -f compose.yml -f compose.release.yml up -d
# PowerShell : $env:TAG="<sha>"; docker compose ... — cmd : set "TAG=<sha>" && docker compose ...
# (détails : documentation/09-deploiement.md)
# TAG : SHA complet du commit (immuable, recommandé) ou, à défaut, develop / main / SNAPSHOT
# (tags mobiles, à éviter pour déployer). Les versions X.Y.Z arriveront avec le workflow release.yml.
# Le profil Spring est forcé (prod par défaut), il ne retombe jamais sur `dev`.
services:
  back:
    image: ghcr.io/mikedel88/microcrm-back:${TAG:?TAG requis (version X.Y.Z ou SHA)}
    pull_policy: always
    environment:
      SPRING_PROFILES_ACTIVE: ${RELEASE_PROFILE:-prod}
  front:
    image: ghcr.io/mikedel88/microcrm-front:${TAG:?TAG requis (version X.Y.Z ou SHA)}
    pull_policy: always

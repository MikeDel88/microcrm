# Test (CI) : docker compose -f compose.yml -f compose.test.yml up -d --build
# Arrêt et nettoyage : docker compose -f compose.yml -f compose.test.yml down -v
services:
  back:
    environment:
      SPRING_PROFILES_ACTIVE: test
      # application-test.properties n'est pas dans le JAR (src/test) : mêmes réglages passés en variables
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_COM_OPENCLASSROOM_DEVOPS_ORION_MICROCRM: INFO
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/organizations || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

plugins {
	id 'java'
	id 'checkstyle'
	id 'jacoco'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'com.adarshr.test-logger' version '4.0.0'
	id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.openclassroom.devops.orion'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	// Logs ECS (format Elastic) : la propriété native logging.structured n'existe qu'à partir de Spring Boot 3.4
	implementation 'co.elastic.logging:logback-ecs-encoder:1.6.0'
	implementation 'ro.polak:spring-boot-data-fixtures:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	runtimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

checkstyle {
	toolVersion = '10.17.0'
	configFile = file('config/checkstyle/checkstyle.xml')
	maxWarnings = 0
}

bootJar {
	archiveFileName = 'microcrm.jar'
}

test {
    useJUnitPlatform()
    // Les tests utilisent toujours le profil « test », jamais « dev »
    environment 'SPRING_PROFILES_ACTIVE', 'test'
    finalizedBy jacocoTestReport
}

jacocoTestReport {
	reports {
		xml.required = true
	}
}

// Analyse SonarQube Cloud : binaires, libraries (main/test) et rapport JaCoCo déduits du modèle Gradle
sonar {
	properties {
		property 'sonar.projectKey', 'mikedel88_microcrm_back'
		property 'sonar.organization', 'mikedel88'
		property 'sonar.host.url', 'https://sonarcloud.io'
		// Le job attend le verdict : échoue si l'analyse est rejetée ou si le quality gate est rouge
		property 'sonar.qualitygate.wait', 'true'
	}
}
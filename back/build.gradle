plugins {
	id 'java'
	id 'checkstyle'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.adarshr.test-logger' version '4.0.0'
	id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.openclassroom.devops.orion'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

// Surcharges du BOM Spring Boot 4.1.1 pour corriger des CVE détectées par Trivy.
// À retirer dès que Spring Boot embarque ces versions (ou plus récentes).
ext['tomcat.version'] = '11.0.25'
ext['jackson-bom.version'] = '3.1.7'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'ro.polak:spring-boot-data-fixtures:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	runtimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

checkstyle {
	toolVersion = '10.17.0'
	configFile = file('config/checkstyle/checkstyle.xml')
	maxWarnings = 0
}

bootJar {
	archiveFileName = 'microcrm.jar'
}

test {
    useJUnitPlatform()
    // Les tests utilisent toujours le profil « test », jamais « dev »
    environment 'SPRING_PROFILES_ACTIVE', 'test'
    finalizedBy jacocoTestReport
}

jacocoTestReport {
	reports {
		xml.required = true
	}
}

// Analyse SonarQube Cloud : binaires, libraries (main/test) et rapport JaCoCo déduits du modèle Gradle
sonar {
	properties {
		property 'sonar.projectKey', 'mikedel88_microcrm_back'
		property 'sonar.organization', 'mikedel88'
		property 'sonar.host.url', 'https://sonarcloud.io'
		// Le job attend le verdict : échoue si l'analyse est rejetée ou si le quality gate est rouge
		property 'sonar.qualitygate.wait', 'true'
	}
}
# Profil de développement (poste local) : spring.profiles.active=dev
spring.datasource.url=jdbc:hsqldb:mem:microcrm-dev
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
logging.level.com.openclassroom.devops.orion.microcrm=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# Une ligne de log par requête HTTP (méthode, URL, statut) pour l'analyse dans ELK
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
# Métriques (JVM, HTTP, JDBC) exposées pour Metricbeat (module prometheus)
management.endpoints.web.exposure.include=health,metrics,prometheus

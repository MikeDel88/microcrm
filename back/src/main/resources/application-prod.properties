# Profil de production : spring.profiles.active=prod (activé par compose.release.yml)
# Base HSQLDB en mémoire (comme le reste du projet) : à remplacer par une vraie datasource
# lue depuis des variables d'environnement quand une base persistante sera ajoutée.
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.com.openclassroom.devops.orion.microcrm=INFO
logging.level.org.hibernate.SQL=WARN

sonar.projectKey=mikedel88_microcrm_front
sonar.organization=mikedel88
sonar.sourceEncoding=UTF-8

# Chemins relatifs au dossier front (projectBaseDir dans ci.yml)
# Code source et tests (front Angular)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts
# Images exclues : fichiers binaires signalés comme erreurs d'encodage par le scanner
sonar.exclusions=src/**/*.spec.ts,src/**/*.png,src/**/*.ico,src/**/*.jpg,src/**/*.svg

# Front : couverture Karma (lcov)
sonar.javascript.lcov.reportPaths=coverage/microcrm/lcov.info

# Le job attend le traitement côté SonarCloud : échoue si l'analyse est rejetée ou si le quality gate est rouge
sonar.qualitygate.wait=true

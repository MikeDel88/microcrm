# CI : validation d'une pull request avant fusion.
#
# Déclencheurs : PR vers develop ou main, ou lancement manuel. Pas de déclencheur sur
# push de branche (feature/**, fix/**) : cela doublerait chaque run quand une PR est ouverte.
# Pour un retour avant revue, ouvrir une PR en brouillon.
#
# Les jobs sont indépendants et tournent en parallèle, sauf sonar (réutilise les rapports des tests).
#   Tests      : back-tests, front-tests
#   Build      : build
#   Qualité    : secrets (Gitleaks), linter-back, linter-front, sonar
#   Sécurité   : codeql, dependency-review, npm-audit (PR uniquement)
#   Image      : buildx (build des images, test de fumée, scan Trivy)
#   Validation : ci-ok, seul check à rendre obligatoire dans la protection de branche
#
# La CD (cd.yml) n'est pas chaînée à ce workflow : la protection de branche impose
# que ci-ok soit vert avant toute fusion sur develop ou main.
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Un nouveau push sur la PR annule le run précédent encore en cours
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 20
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: 17

jobs:
  # TESTS : les rapports sont publiés en artefacts, sonar les récupère pour la couverture
  back-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - run: chmod +x gradlew
      - name: Tests Back
        run: ./gradlew test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: back-reports
          path: |
            back/build/reports
            back/build/test-results
            back/build/classes
  front-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Tests Front
        run: npm run test:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: front-coverage
          path: front/coverage

  # BUILD : compilation back et front, sans les tests (déjà faits ci-dessus)
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Build Back
        working-directory: back
        run: |
          chmod +x gradlew
          ./gradlew build -x test
      - name: Build Front
        working-directory: front
        run: |
          npm ci
          npm run build



  # QUALITE
  # Détection de secrets sur tout l'historique (fetch-depth 0)
  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  linter-back:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - run: chmod +x gradlew
      - name: Lint Back
        run: ./gradlew checkstyleMain checkstyleTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: back-checkstyle
          path: back/build/reports/checkstyle
  linter-front:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Lint Front
        run: npm run lint -- --format html --output-file eslint-report.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: front-linter
          path: front/eslint-report.html
  # Analyse SonarQube Cloud : attend les tests pour importer les rapports de couverture
  sonar:
    needs: [back-tests, front-tests]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: back-reports
          path: back/build
      - uses: actions/download-artifact@v7
        with:
          name: front-coverage
          path: front/coverage
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # SECURITY IN PULL_REQUEST
  # CodeQL : analyse statique (SAST) du Java/Kotlin (build manuel) et du JS/TS (sans build)
  codeql:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - name: Build pour CodeQL (Java)
        if: matrix.language == 'java-kotlin'
        working-directory: back
        run: |
          chmod +x gradlew
          ./gradlew build -x test
      - uses: github/codeql-action/analyze@v4
  # Dépendances ajoutées par la PR : échec à partir de la sévérité high
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
  # Informatif : --audit-level=none ne fait jamais échouer le job (dépendances front à migrer).
  # À passer à high une fois les vulnérabilités existantes corrigées.
  npm-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --audit-level=none --json

  # BUILD IMAGE DOCKER : construit les images via compose, vérifie qu'elles démarrent
  # (--wait attend les healthchecks = test de fumée), puis scanne avec Trivy (vers develop et main, comme cd.yml).
  # Ces images servent au test ; celles publiées sont construites et scannées par cd.yml.
  buildx:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image docker (test)
        env:
          COMPOSE_PROJECT_NAME: microcrm
        run: docker compose -f compose.yml -f compose.test.yml up -d --build --wait --wait-timeout 120
      - name: Cas d'echec
        if: failure()
        run: docker compose -f compose.yml -f compose.test.yml logs
      - name: Scan Trivy (back)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: microcrm-back
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Scan Trivy (front)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: microcrm-front
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Nettoyage
        if: always()
        run: docker compose -f compose.yml -f compose.test.yml down -v || true

  # CI VALIDATION : job agrégé, c'est lui qu'exige la protection de branche.
  # if: always() pour s'exécuter même si un job a échoué. Il échoue si un job est en
  # échec ou annulé ; un job ignoré (skipped) n'est pas un échec.
  ci-ok:
    if: always()
    needs:
      - front-tests
      - back-tests
      - build
      - secrets
      - linter-back
      - linter-front
      - sonar
      - codeql
      - dependency-review
      - npm-audit
      - buildx
    runs-on: ubuntu-22.04
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Au moins un job a échoué ou a été annulé"
            exit 1
          fi
          echo "Tous les contrôles requis sont au vert"


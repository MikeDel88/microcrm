name: CI

on:
  push:
    branches: ["feature/**", "fix/**"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 20
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: 17

jobs:
  # TESTS
  back-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - run: chmod +x gradlew
      - name: Tests Back
        run: ./gradlew test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: back-reports
          path: |
            back/build/reports
            back/build/test-results
            back/build/classes
  front-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Tests Front
        run: npm run test:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: front-coverage
          path: front/coverage

  # BUILD
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Build Back
        working-directory: back
        run: |
          chmod +x gradlew
          ./gradlew build -x test
      - name: Build Front
        working-directory: front
        run: |
          npm ci
          npm run build



  # QUALITE
  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  linter-back:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - run: chmod +x gradlew
      - name: Lint Back
        run: ./gradlew checkstyleMain checkstyleTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: back-checkstyle
          path: back/build/reports/checkstyle
  linter-front:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Lint Front
        run: npm run lint -- --format html --output-file eslint-report.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: front-linter
          path: front/eslint-report.html
  sonar:
    needs: [back-tests, front-tests]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: back-reports
          path: back/build
      - uses: actions/download-artifact@v7
        with:
          name: front-coverage
          path: front/coverage
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # SECURITY IN PULL_REQUEST
  codeql:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - name: Build pour CodeQL (Java)
        if: matrix.language == 'java-kotlin'
        working-directory: back
        run: |
          chmod +x gradlew
          ./gradlew build -x test
      - uses: github/codeql-action/analyze@v4
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
  npm-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --audit-level=high --json

  # BUILD IMAGE DOCKER
  buildx:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image docker (test)
        run: docker compose -f compose.yml -f compose.test.yml up -d --build --wait --wait-timeout 120
      - name: Cas d'echec
        if: failure()
        run: docker compose -f compose.yml -f compose.test.yml logs

  # CI VALIDATION
  ci-ok:
    if: always()
    needs:
      - front-tests
      - back-tests
      - build
      - secrets
      - linter-back
      - linter-front
      - sonar
      - codeql
      - dependency-review
      - npm-audit
    runs-on: ubuntu-22.04
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Au moins un job a échoué ou a été annulé"
            exit 1
          fi
          echo "Tous les contrôles requis sont au vert"


name: CI

on:
  push:
    branches: ["feature/**", "fix/**"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 20
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: 17

jobs:
  # TESTS
  back-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - run: chmod +x gradlew
      - name: Tests Back
        run: ./gradlew test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: back-reports
          path: |
            back/build/reports
            back/build/test-results
            back/build/classes
  front-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Tests Front
        run: npm run test:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: front-coverage
          path: front/coverage

  # BUILD
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Build Back
        working-directory: back
        run: |
          chmod +x gradlew
          ./gradlew build -x test
      - name: Build Front
        working-directory: front
        run: |
          npm ci
          npm run build

  # QUALITE
  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  linter:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Lint Front
        run: npm run lint


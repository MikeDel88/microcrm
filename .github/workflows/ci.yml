# CI : build, tests et analyse SonarQube Cloud (voir documentation/07-pipeline-ci.md).
#
# Déclencheurs (documentation/04-plan-testing-periodique.md) :
#   - pull request vers develop ou main : validation complète avant fusion ;
#   - push sur main (après fusion) : tient à jour l'analyse SonarQube Cloud de main ;
#   - lancement manuel.
#
# Enchaînement : back et front en parallèle, puis sonar (réutilise leurs rapports),
# puis ci-ok, seul check à rendre obligatoire dans la protection de branche.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  workflow_dispatch:

# Un nouveau push sur la même branche annule le run précédent encore en cours
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Moindre privilège : lecture seule par défaut, élargi job par job si nécessaire
permissions:
  contents: read

env:
  NODE_VERSION: 20
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: 17

jobs:
  # BACK : compilation, tests JUnit + couverture JaCoCo, Checkstyle et JAR en une seule commande
  back:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write # publication du rapport de tests
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      # gradlew n'a pas le droit d'exécution dans le dépôt
      - run: chmod +x gradlew
      - name: Build et tests back
        run: ./gradlew build
      - name: Rapport de tests back
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Tests back (JUnit)
          report_paths: back/build/test-results/test/*.xml
          require_tests: true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: back-reports
          path: |
            back/build/reports
            back/build/test-results
      - uses: actions/upload-artifact@v7
        with:
          name: back-jar
          path: back/build/libs/microcrm.jar

  # FRONT : tests Karma (Chrome headless) avec couverture, puis build Angular
  front:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write # publication du rapport de tests
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Tests front
        run: npm run test:ci
      - name: Build front
        run: npm run build
      - name: Rapport de tests front
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Tests front (Karma)
          report_paths: front/test-results/*.xml
          require_tests: true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: front-coverage
          path: front/coverage
      - uses: actions/upload-artifact@v7
        with:
          name: front-dist
          path: front/dist/microcrm/browser

  # SONARQUBE CLOUD : qualité et sécurité, couverture importée depuis les jobs back et front.
  # Le job attend le quality gate (sonar.qualitygate.wait=true) : il échoue si le gate est rouge.
  sonar:
    needs: [back, front]
    runs-on: ubuntu-22.04
    steps:
      # Historique complet : nécessaire à Sonar pour détecter le nouveau code
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: back-reports
          path: back/build
      - uses: actions/download-artifact@v7
        with:
          name: front-coverage
          path: front/coverage
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      # Back : plugin Gradle (config dans build.gradle), qui fournit classes et classpath à Sonar
      - name: Sonar back
        working-directory: back
        run: |
          chmod +x gradlew
          ./gradlew compileJava compileTestJava sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACK }}
      # Front : config dans front/sonar-project.properties
      - name: Sonar front
        if: ${{ !cancelled() }}
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: front
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONT }}

  # VALIDATION : job agrégé exigé par la protection de branche.
  # if: always() pour s'exécuter même si un job a échoué ; échoue si un job est en échec ou annulé.
  ci-ok:
    if: always()
    needs: [back, front, sonar]
    runs-on: ubuntu-22.04
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Au moins un job a échoué ou a été annulé"
            exit 1
          fi
          echo "Build, tests et analyse SonarQube Cloud au vert"

name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 20
  REGISTRY: ghcr.io

jobs:
  # BUILD : une image par service (target du Dockerfile), taguée par SHA
  build:
    runs-on: ubuntu-22.04
    concurrency:
      group: cd-build-${{ github.ref }}-${{ matrix.service }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: [back, front]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image name (minuscules, requis par GHCR)
        id: image
        run: |
          IMAGE=$(echo "${REGISTRY}/${{ github.repository_owner }}/microcrm-${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags SHA + branche + SNAPSHOT sur develop)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=raw,value=SNAPSHOT,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Generate artifact attestation
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # SCAN : l'image :sha doit être saine avant toute release (main uniquement)
  scan:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [back, front]
    steps:
      - name: Image name
        id: image
        run: |
          IMAGE=$(echo "${REGISTRY}/${{ github.repository_owner }}/microcrm-${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Scan Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  # RELEASE : version calculée par semantic-release (main uniquement)
  release:
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Semantic release
        id: release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # PROMOTION : retag de l'image :sha en :X.Y.Z et :latest (sans rebuild)
  promote:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [back, front]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: |
          IMAGE=$(echo "${REGISTRY}/${{ github.repository_owner }}/microcrm-${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Retag image with release version
        run: |
          docker buildx imagetools create \
            -t "${{ steps.image.outputs.name }}:${{ needs.release.outputs.version }}" \
            -t "${{ steps.image.outputs.name }}:latest" \
            "${{ steps.image.outputs.name }}:${{ github.sha }}"


  # En cas d'échec de la CD, on crée une issue.
  notify-failure:
    if: failure()
    needs: [build, scan, release, promote]
    runs-on: ubuntu-22.04
    permissions:
      issues: write
    steps:
      - name: Créer ou commenter l'issue (une par branche, sans doublon)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LABEL="publish-failure"
          TITLE="Échec de publication – $GITHUB_REF_NAME"
          gh label create "$LABEL" --color B60205 --description "Échec du workflow de publication" 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label "$LABEL" --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          BODY="Le workflow de publication a échoué sur \`$GITHUB_REF_NAME\` (commit $GITHUB_SHA). Exécution : $RUN_URL"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi
sonar.projectKey=MikeDel88_microcrm
sonar.organization=mikedel88

sonar.qualitygate.wait=true

# Code source et tests (back Java + front Angular)
sonar.sources=back/src/main,front/src
sonar.tests=back/src/test,front/src
sonar.test.inclusions=back/src/test/**,front/src/**/*.spec.ts
sonar.exclusions=front/src/**/*.spec.ts

# Back : classes compilées et couverture JaCoCo
sonar.java.binaries=back/build/classes
sonar.coverage.jacoco.xmlReportPaths=back/build/reports/jacoco/test/jacocoTestReport.xml

# Front : couverture Karma (lcov)
sonar.javascript.lcov.reportPaths=front/coverage/microcrm/lcov.info

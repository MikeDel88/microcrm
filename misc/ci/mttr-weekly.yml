# Workflow DORA "temps de rétablissement" (MTTR) hebdomadaire (NON actif : ce fichier n'est pas
# dans .github/workflows).
#
# Utilisation : copier ce fichier dans .github/workflows/ puis le fusionner sur main
# (un workflow planifié ne s'exécute que depuis la branche par défaut).
#
# Définition retenue : un incident commence au premier run `failure` de cd.yml sur une branche
# et se termine à la fin du premier run `success` suivant sur cette branche. Plusieurs échecs
# consécutifs comptent comme un seul incident. Fenêtre : 30 jours glissants, main et develop.
# Résultat : tableau dans le résumé du run + JSON en artefact `mttr`.
#
# Limites :
#   - la "production" s'arrête à la publication dans GHCR : c'est le rétablissement de la publication ;
#   - sans échec de CD sur la période, il n'y a aucune valeur (le tableau affiche "–") : ce n'est pas une erreur ;
#   - un incident ouvert avant le début de la fenêtre n'est pas vu, et 100 runs maximum sont lus par branche ;
#   - les runs annulés ou ignorés ne sont pas pris en compte.
name: MTTR

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mttr:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Calcul du temps de rétablissement
        run: |
          SINCE=$(date -u -d '30 days ago' +%Y-%m-%d)
          UNTIL=$(date -u +%Y-%m-%d)

          # Runs triés par date de début ; un échec ouvre un incident, le succès suivant le ferme.
          cat > mttr.jq <<'EOF'
          [.workflow_runs[]
            | select(.conclusion == "success" or .conclusion == "failure")
            | {c: .conclusion, start: (.run_started_at | fromdate), end: (.updated_at | fromdate)}]
          | sort_by(.start)
          | reduce .[] as $r ({open: null, out: []};
              if $r.c == "failure" then
                (if .open == null then .open = $r.start else . end)
              elif .open != null then
                (.out += [$r.end - .open] | .open = null)
              else . end)
          | {durations: .out, open: .open,
             median: (.out | sort | if length == 0 then null else .[((length - 1) / 2 | floor)] end)}
          EOF

          {
            echo "## Temps de rétablissement de la CD ($SINCE → $UNTIL)"
            echo
            echo "| Branche | Incidents résolus | MTTR médian | Incident en cours |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "[]" > mttr.json
          for BRANCH in main develop; do
            RES=$(gh api -X GET "repos/$REPO/actions/workflows/cd.yml/runs" \
              -f branch="$BRANCH" -f event=push -f created=">=$SINCE" -f per_page=100 | jq -c -f mttr.jq)

            N=$(jq '.durations | length' <<<"$RES")
            MED=$(jq '.median' <<<"$RES")
            OPEN=$(jq '.open' <<<"$RES")

            if [ "$MED" = "null" ]; then MEDF="–"; else MEDF="$((MED / 60)) min"; fi
            if [ "$OPEN" = "null" ]; then OPENF="non"; else OPENF="oui"; fi

            echo "| $BRANCH | $N | $MEDF | $OPENF |" >> "$GITHUB_STEP_SUMMARY"
            jq --arg b "$BRANCH" --argjson r "$RES" '. + [{branch: $b} + $r]' mttr.json > mttr.tmp && mv mttr.tmp mttr.json
          done

      - uses: actions/upload-artifact@v7
        with:
          name: mttr
          path: mttr.json

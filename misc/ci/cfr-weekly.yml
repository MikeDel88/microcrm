# Workflow DORA "taux d'échec des changements" (CFR) hebdomadaire (NON actif : ce fichier n'est pas
# dans .github/workflows).
#
# Utilisation : copier ce fichier dans .github/workflows/ puis le fusionner sur main
# (un workflow planifié ne s'exécute que depuis la branche par défaut).
#
# Deux taux sur 30 jours glissants, pour main et develop, à partir des runs de cd.yml :
#   - échecs de pipeline : runs `failure` / (runs `success` + `failure`). Un échec de build ou de
#     scan bloque l'image AVANT la publication : c'est la pipeline qui joue son rôle de filtre,
#     le changement n'atteint pas GHCR. Ce taux n'est donc pas un incident au sens DORA.
#   - échecs après publication : runs dont un job `release` ou `promote` a échoué. Une image est
#     déjà publiée, la version peut être incomplète : c'est le taux le plus proche de DORA.
# Résultat : tableau dans le résumé du run + JSON en artefact `cfr`.
#
# Limites :
#   - la "production" s'arrête à la publication dans GHCR (pas de déploiement automatisé) ;
#   - peu de runs sur la période = taux peu significatif ("–" si aucun run) ;
#   - seuls les runs `success` et `failure` comptent (annulés et ignorés exclus), 100 runs lus au maximum par branche ;
#   - develop n'a ni job `release` ni `promote` : son taux après publication vaut toujours 0.
name: CFR

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cfr:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Calcul du taux d'échec
        run: |
          SINCE=$(date -u -d '30 days ago' +%Y-%m-%d)
          UNTIL=$(date -u +%Y-%m-%d)

          rate() { awk -v a="$1" -v b="$2" 'BEGIN{ if (b == 0) print "–"; else printf "%.1f %%", a * 100 / b }'; }

          {
            echo "## Taux d'échec des changements ($SINCE → $UNTIL)"
            echo
            echo "| Branche | Runs CD | Échecs pipeline | Taux pipeline | Échecs après publication | Taux après publication |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "[]" > cfr.json
          for BRANCH in main develop; do
            RUNS=$(gh api -X GET "repos/$REPO/actions/workflows/cd.yml/runs" \
              -f branch="$BRANCH" -f event=push -f created=">=$SINCE" -f per_page=100 \
              --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure") | {id: .id, c: .conclusion}]')

            TOTAL=$(jq 'length' <<<"$RUNS")
            FAILED=$(jq '[.[] | select(.c == "failure")] | length' <<<"$RUNS")

            # Parmi les runs en échec, ceux où release ou promote a échoué (après publication de l'image)
            POST=0
            for ID in $(jq -r '.[] | select(.c == "failure") | .id' <<<"$RUNS"); do
              N=$(gh api "repos/$REPO/actions/runs/$ID/jobs?per_page=100" \
                --jq '[.jobs[] | select((.name | test("^(release|promote)")) and .conclusion == "failure")] | length')
              if [ "$N" -gt 0 ]; then POST=$((POST + 1)); fi
            done

            echo "| $BRANCH | $TOTAL | $FAILED | $(rate "$FAILED" "$TOTAL") | $POST | $(rate "$POST" "$TOTAL") |" >> "$GITHUB_STEP_SUMMARY"
            jq --arg b "$BRANCH" --argjson t "$TOTAL" --argjson f "$FAILED" --argjson p "$POST" \
              '. + [{branch: $b, runs: $t, pipeline_failures: $f, post_publication_failures: $p}]' cfr.json > cfr.tmp && mv cfr.tmp cfr.json
          done

      - uses: actions/upload-artifact@v7
        with:
          name: cfr
          path: cfr.json

# Job DORA "lead time" prêt à l'emploi (NON actif : ce fichier n'est pas dans .github/workflows).
#
# Utilisation : copier le bloc `lead-time` sous `jobs:` de .github/workflows/cd.yml.
# Il suppose les jobs `release` (output `version`) et `promote` de cd.yml.
#
# Ce qui est mesuré : pour chaque commit livré dans la version (ceux qui séparent le tag
# précédent de github.sha), le délai entre la date du commit et la fin de `promote`.
# Résultat : médiane dans le résumé du run + liste des délais (secondes) en artefact `lead-time`.
#
# Limites : avec un squash ou un rebase, la date du commit n'est pas celle du début du travail ;
# préférer alors la date d'ouverture de la PR (gh pr list --search "<sha>" --state merged
# --json createdAt,mergedAt). La "mise en production" est ici la publication de l'image dans GHCR.
jobs:
  # LEAD TIME DORA : délai entre chaque commit livré et la mise à disposition de la version
  lead-time:
    needs: [release, promote]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calcul du lead time
        run: |
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_SHA" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          NOW=$(date +%s)
          git log --format=%ct "$PREV..$GITHUB_SHA" | awk -v now="$NOW" '{print now-$1}' | sort -n > lead-time.txt
          N=$(wc -l < lead-time.txt)
          MEDIAN=$(awk '{a[NR]=$1} END{print a[int((NR+1)/2)]}' lead-time.txt)
          echo "Version ${{ needs.release.outputs.version }} : $N commits, lead time médian $((MEDIAN/3600)) h $(((MEDIAN%3600)/60)) min" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: lead-time
          path: lead-time.txt
